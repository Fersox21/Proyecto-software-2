<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="catalogo.css">
    <title>Document</title>
</head>
<body>
    <header class="sidebar">
        
        <a href="index.html" class="brand-logo">    
            <img 
                src="/Resources/Img/Logo/Logo-Lafe.png" 
                class="logo"
                alt="LaFe Distribuidora"
            >

        <nav class="nav" aria-label="Navegación principal">
            <ul class="ul-nav">
                <li><a class="a-nav" href="index.html">Inicio</a></li>
                <li><a class="a-nav" href="catalogo.html">Catálogo</a></li>
                <li><a class="a-nav" href="preguntas.html">Preguntas Frecuentes</a></li>
                <li><a class="a-nav" href="index.html#contacto">Contacto</a></li>
                <li><a class="a-nav" href="formulario1.html">¿Te interesa?</a></li>
                <li><a class="a-nav" href="https://maps.app.goo.gl/CwepvbVbgh7MhPcr7" target="_blank" rel="noopener noreferrer">Encontranos</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">

            <h2 class="titulo-h2">Catalogo de Productos</h2>
            <div class="div-buscador">
                <input type="search" id="buscador" placeholder="Buscar producto">
                <button type="button" class="boton-buscador">
                    <img src="Resources/Img/Items/search_24dp_7A7A7A_FILL0_wght400_GRAD0_opsz24.svg"
                    class="lupa"
                    alt="buscador">
                </button>
            </div>

            <!-- Contenedor vacío: JavaScript inserta acá las tarjetas -->
            <section id="grilla-productos" class="grilla-productos" aria-live="polite"></section>

            <!-- Mensaje para cuando el buscador no encuentra nada -->
            <p id="sin-resultados" class="sin-resultados" hidden>No se encontraron productos.</p>

            <!--
              Molde de una tarjeta. El contenido de <template> NO se muestra
              ni carga imágenes hasta que JS lo clona. Es solo la "forma".
            -->
            <template id="tpl-producto">
                <article class="card-producto">
                    <img class="card-img" src="" alt="">
                    <h3 class="card-nombre"></h3>
                    <p class="card-precio"></p>
                    <button type="button" class="card-boton">Agregar</button>
                </article>
            </template>
    </main>
    <footer>
        <p>LaFe se reserva todos los derechos</p>
        <p>Copyright 2026</p>
    </footer>

    <script src="catalogo.js" defer></script>
</body>
</html>
