<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frotend/css/panelAdmin/adminProductos.css">
    <link rel="stylesheet" href="frotend/css/panelAdmin/navbarAdmin.css">
    <script type="module" src="frotend/js/panelAdmin/adminProducto.js" defer></script>
    <title>LaFe Distribuidora</title>
</head>
<body>
    <header class="sidebar-admin" id="sidebar-admin">
        <nav class="nav-admin">
            <h2 class="h2-admin">La <span id="Fe-h2-admin">Fe</span> · admin</h2>
            <p class="p-nav li-nav">GENERAL</p>
            <ul class="ul-nav-admin">
                <li class="li-nav li-nav-h"><a class="a-nav-admin" href="./adminResumen.html">Resumen</a></li>
                <li class="li-nav li-nav-h"><a class="a-nav-admin" href="./adminProductos.html">Productos</a></li>
                <li class="li-nav li-nav-h"><a class="a-nav-admin" href="./index.html">Volver al Inicio</a> </li>
            </ul>
            <p class="p-nav li-nav" id="p-cuenta-nav">CUENTA</p>
            <ul class="ul-nav-admin">
                <li class="li-nav li-nav-h"><a class="a-nav-admin" href="./configuracion.html">Configuración</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-admin" id="main-admin">
        <aside class="aside-admin">
            <h1 class="h1-admin">Productos</h1>
            <button class="agregar-prod">+ Agregar producto</button>
        </aside>
        <section id="sec-prod-admin" class="sec-prod-admin" aria-live="polite">
            <table class="tabla-prod-admin">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-admin-body"></tbody>
            </table>
            <div class="tabla-admin-pie">
                <span id="info-pag">Mostrando 0–0 de 0</span>
                <div class="control-pag">
                    <button type="button" id="anterior-pag">‹</button>
                    <span id="nums-pag"></span>
                    <button type="button" id="siguiente-pag">›</button>
                </div>
            </div>
        </section>
        <template id="temp-tabla-admin">
            <tr>
                <td class="col-admin col-nombre"></td>
                <td class="col-admin col-categoria"></td>
                <td class="col-admin col-precio"></td>
                <td class="col-admin col-stock"></td>
                <td class="col-admin"><span class="col-estado"></span></td>
                <td class="col-admin col-acciones"></td>
            </tr>
        </template>
    </main>
</body>
</html>
